<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brook AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">
    
        <aside class="sidebar">
    
            <h2>🤖 Brook AI</h2>
    
            <button class="new-chat">
                + New Chat
            </button>
    
            <div class="chat-list">
                <p>Physics</p>
                <p>Coding</p>
                <p>College</p>
                <p>Random</p>
            </div>
    
        </aside>
    
    
        <main class="main">
    
            <header class="header">
    
                <h1>Brook AI</h1>
    
                <div class="model">
                    🟢 Qwen3:4B
                </div>
    
            </header>
    
    
            <div id="chat-box"></div>
    
    
            <div class="input-area">
    
                <input id="prompt" type="text" placeholder="Ask anything...">
    
                <button id="send-btn">
                    ➤
                </button>
    
            </div>
    
        </main>
    
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
